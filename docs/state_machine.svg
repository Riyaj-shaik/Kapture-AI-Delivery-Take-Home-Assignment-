<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="700" y="36" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">Conversation State Machine — Collections Call</text>

  <!-- STATE 0 -->
  <rect x="40" y="90" width="200" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="120" font-size="14" text-anchor="middle" font-weight="bold">STATE 0</text>
  <text x="140" y="140" font-size="12" text-anchor="middle">Greeting</text>

  <!-- STATE 1 -->
  <rect x="320" y="90" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="420" y="120" font-size="14" text-anchor="middle" font-weight="bold">STATE 1</text>
  <text x="420" y="140" font-size="12" text-anchor="middle">Auth (locked gate)</text>

  <!-- STATE 2 -->
  <rect x="600" y="90" width="220" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="120" font-size="14" text-anchor="middle" font-weight="bold">STATE 2</text>
  <text x="710" y="140" font-size="12" text-anchor="middle">Disclosure &amp; Negotiation</text>

  <!-- STATE 4 -->
  <rect x="1140" y="90" width="200" height="70" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="1240" y="120" font-size="14" text-anchor="middle" font-weight="bold">STATE 4</text>
  <text x="1240" y="140" font-size="12" text-anchor="middle">Closing / Disposition</text>

  <!-- arrows main chain -->
  <line x1="240" y1="125" x2="320" y2="125" stroke="#374151" stroke-width="2" marker-end="url(#a1)"/>
  <text x="280" y="115" font-size="11" text-anchor="middle" fill="#374151">confirmed</text>

  <line x1="520" y1="125" x2="600" y2="125" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="560" y="112" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="bold">verify_customer</text>
  <text x="560" y="145" font-size="11" text-anchor="middle" fill="#16a34a" font-weight="bold">= verified:true</text>

  <!-- Branches from STATE 2 -->
  <g font-size="12">
    <rect x="600" y="220" width="220" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="710" y="242" text-anchor="middle" font-weight="bold">Branch A: Will Pay</text>
    <text x="710" y="260" text-anchor="middle">log_promise_to_pay + send_payment_link</text>

    <rect x="600" y="285" width="220" height="55" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="710" y="307" text-anchor="middle" font-weight="bold">Branch B: Already Paid</text>
    <text x="710" y="325" text-anchor="middle">mark_disposition(ALREADY_PAID)</text>

    <rect x="600" y="350" width="220" height="55" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="710" y="372" text-anchor="middle" font-weight="bold">Branch C: Hardship</text>
    <text x="710" y="390" text-anchor="middle">escalate_to_agent(HARDSHIP)</text>

    <rect x="600" y="415" width="220" height="55" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text x="710" y="437" text-anchor="middle" font-weight="bold">Branch D: Dispute</text>
    <text x="710" y="455" text-anchor="middle">escalate_to_agent(DISPUTE)</text>

    <rect x="600" y="480" width="220" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="710" y="502" text-anchor="middle" font-weight="bold">Branch E: Do Not Call</text>
    <text x="710" y="520" text-anchor="middle">mark_disposition(DO_NOT_CALL)</text>

    <rect x="600" y="545" width="220" height="55" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="710" y="567" text-anchor="middle" font-weight="bold">Branch F: Abusive</text>
    <text x="710" y="585" text-anchor="middle">1 warning → terminate</text>
  </g>

  <!-- branch arrows to state 4 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a3)">
    <path d="M 820 247 C 1000 247 1000 125 1140 125"/>
    <path d="M 820 312 C 1000 312 1000 130 1140 130"/>
    <path d="M 820 377 C 1000 377 1000 135 1140 135"/>
    <path d="M 820 442 C 1000 442 1000 140 1140 140"/>
    <path d="M 820 507 C 1000 507 1000 145 1140 145"/>
    <path d="M 820 572 C 1000 572 1000 150 1140 150"/>
  </g>

  <!-- Off-ramps from state 0/1 -->
  <g font-size="12">
    <rect x="40" y="220" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="140" y="240" text-anchor="middle" font-weight="bold">Wrong number /</text>
    <text x="140" y="257" text-anchor="middle">wrong person</text>

    <rect x="320" y="220" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="420" y="240" text-anchor="middle" font-weight="bold">Verify fails x2</text>
    <text x="420" y="257" text-anchor="middle">VERIFICATION_FAILED</text>

    <rect x="40" y="290" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="140" y="310" text-anchor="middle" font-weight="bold">No input x2</text>
    <text x="140" y="327" text-anchor="middle">NO_RESPONSE</text>
  </g>

  <path d="M 140 160 L 140 220" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a3)" fill="none"/>
  <path d="M 420 160 L 420 220" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a3)" fill="none"/>
  <path d="M 140 270 L 140 290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a3)" fill="none"/>

  <path d="M 240 245 C 700 245 1050 200 1140 155" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a3)" fill="none"/>
  <path d="M 520 245 C 800 230 1050 195 1140 160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a3)" fill="none"/>
  <path d="M 240 315 C 700 300 1050 205 1140 165" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a3)" fill="none"/>

  <text x="700" y="650" font-size="13" font-weight="bold" fill="#1f2937">Guardrail: transitions out of STATE 1 (auth) into STATE 2 are locked behind a tool result, not model discretion.</text>
  <text x="700" y="672" font-size="13" fill="#374151">Branch E (Do Not Call) and abusive-language detection can interrupt from any state and short-circuit directly to STATE 4.</text>
  <text x="700" y="694" font-size="13" fill="#374151">Every terminal path — happy or edge case — ends with exactly one mark_disposition() call before hangup.</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
